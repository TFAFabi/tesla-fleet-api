<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    img {
      width: 180px;
      height: auto;
      filter: brightness(0) invert(1);
      animation: fade 2.5s ease-in-out infinite;
    }

    @keyframes fade {
      0%, 100% {
        opacity: 0;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Tesla_logo.png" alt="Tesla">
</body>
</html>
